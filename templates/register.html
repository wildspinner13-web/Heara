<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Heara</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="welcome">

        <h1>Join Heara</h1>

        <p>Create your account and start connecting with people.</p>

        <form method="POST" style="width: 100%; max-width: 400px;">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
                style="width:100%; padding:14px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
                style="width:100%; padding:14px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
                style="width:100%; padding:14px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"
            >

            <button class="signup-btn" type="submit" style="margin-top:15px;">
                Create Account
            </button>

        </form>

        <p style="margin-top:20px;">
            Already have an account?
            <a href="/login">Log in</a>
        </p>

    </main>

</body>
</html>
